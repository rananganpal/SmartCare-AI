<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="style.css"></head><body class="dashboard"><div class="topbar"><div><div class="logo">🏥 SmartCare <span>AI</span></div><h1>Hospital Admin Dashboard</h1></div><button class="btn" onclick="logout()">Logout</button></div><div class="cards"><div class="stat"><small>Patients</small><b id="patients">—</b></div><div class="stat"><small>Appointments</small><b id="appointments">—</b></div><div class="stat"><small>Waiting</small><b id="waiting">—</b></div><div class="stat"><small>Avg. Wait</small><b id="avg">—</b></div></div><div class="panel"><h2>📊 Department Analytics</h2><div id="dept"></div></div><div class="panel"><h2>💡 Optimization Insight</h2><div class="notice">Use peak-hour forecasts to distribute appointments across lower-load slots and reduce queue pressure.</div></div><script>const u=JSON.parse(localStorage.getItem('user')||'null');if(!u||u.role!=='admin')location.href='login.html';async function load(){let r=await fetch('https://smartcare-ai-oqq2.onrender.com/admin/analytics');let d=await r.json();patients.textContent=d.patients;appointments.textContent=d.appointments;waiting.textContent=d.waiting;avg.textContent=d.avg_wait+' min';dept.innerHTML=d.departments.map(x=>`<div class="row"><b>${x.department}</b><span>${x.count} appointments</span><span>Avg wait ${x.avg_wait} min</span></div>`).join('')}function logout(){localStorage.removeItem('user');location.href='login.html'}load();</script></body></html>
